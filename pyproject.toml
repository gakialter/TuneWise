[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tunewise-mvp"
version = "0.1.0"
description = "TuneWise Windows offline MVP"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.128.8",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<0.29",
  "pytest==9.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tunewise = ["static/**/*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests/backend"]
